limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=12r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;

    client_max_body_size 10m;
    location = /health { proxy_pass http://api:8000/health; }
    location = /api/v1/auth/login { limit_req zone=auth_per_ip burst=5 nodelay; limit_req_status 429; proxy_pass http://api:8000/api/v1/auth/login; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /api/v1/auth/register { limit_req zone=auth_per_ip burst=5 nodelay; limit_req_status 429; proxy_pass http://api:8000/api/v1/auth/register; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/ { limit_req zone=api_per_ip burst=30 nodelay; limit_req_status 429; proxy_pass http://api:8000/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location / { proxy_pass http://web:3000/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
}
