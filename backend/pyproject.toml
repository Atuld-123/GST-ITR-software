[project]
name = "taxsphere-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "aiosqlite>=0.22", "psycopg[binary]>=3.2", "pydantic-settings>=2.6", "alembic>=1.13", "pyjwt>=2.9", "pwdlib[argon2]>=0.2", "cryptography>=44", "python-multipart>=0.0.20"]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
