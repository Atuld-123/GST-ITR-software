services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taxsphere
      POSTGRES_USER: taxsphere
      POSTGRES_PASSWORD: taxsphere_dev_only
    ports: ["5433:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres_data:
