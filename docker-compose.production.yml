services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: taxsphere
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      MIGRATOR_DB_USER: ${MIGRATOR_DB_USER:?Set MIGRATOR_DB_USER}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?Set MIGRATOR_DB_PASSWORD}
    entrypoint: ["/bin/sh", "-c", "cp /run/secrets/db_server.key /tmp/db_server.key && chown postgres:postgres /tmp/db_server.key && chmod 600 /tmp/db_server.key && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/run/secrets/db_server.crt -c ssl_key_file=/tmp/db_server.key"]
    expose: ["5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/create-db-roles.sh:/docker-entrypoint-initdb.d/10-create-db-roles.sh:ro
    secrets: [db_server.crt, db_server.key]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d taxsphere"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose: ["6379"]
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL using the migrator role}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL using postgresql+asyncpg and ssl=require}
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-taxsphere-india}
      DOCUMENTS_ENCRYPTION_KEY: ${DOCUMENTS_ENCRYPTION_KEY:?Set DOCUMENTS_ENCRYPTION_KEY}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set the public HTTPS origin}
    expose: ["8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: ./frontend
      args:
        TAXSPHERE_API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    expose: ["3000"]
    depends_on: [api]
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${EDGE_TLS_DIRECTORY:?Set EDGE_TLS_DIRECTORY containing fullchain.pem and privkey.pem}:/etc/nginx/tls:ro
    depends_on: [web, api]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q --spider https://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-taxsphere-production-data}
secrets:
  db_server.crt:
    file: ${POSTGRES_TLS_CERT:?Set POSTGRES_TLS_CERT}
  db_server.key:
    file: ${POSTGRES_TLS_KEY:?Set POSTGRES_TLS_KEY}
