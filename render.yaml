databases:
  - name: taxsphere-preview-db
    databaseName: taxsphere
    user: taxsphere
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: taxsphere-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: /bin/sh -c 'python -m alembic upgrade head && exec python -m uvicorn app.main:app --host 0.0.0.0 --port "${PORT:-8000}" --proxy-headers --forwarded-allow-ips "*"'
    healthCheckPath: /health
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taxsphere-preview-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: taxsphere-india
      - key: DOCUMENTS_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://taxsphere-web.onrender.com

  - type: web
    name: taxsphere-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: TAXSPHERE_API_INTERNAL_URL
        fromService:
          type: web
          name: taxsphere-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
